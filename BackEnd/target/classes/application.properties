# GENERAL
server.port=8080

# Required for physical checkout. Explicit 0 enables free shipping.
orders.shipping.flat-rate=${ORDER_SHIPPING_FLAT_RATE:}

# Digital downloads: exact trusted HTTPS hosts, never public catalog links
digital.download.allowed-hosts=${DIGITAL_DOWNLOAD_ALLOWED_HOSTS:}
digital.download.token-minutes=${DIGITAL_DOWNLOAD_TOKEN_MINUTES:15}
digital.download.max-bytes=${DIGITAL_DOWNLOAD_MAX_BYTES:104857600}

# Unpaid order reservation: 30 minutes; automatic check every minute
orders.expiration.reservation-minutes=${ORDER_RESERVATION_MINUTES:30}
orders.expiration.check-delay-ms=${ORDER_EXPIRATION_CHECK_DELAY_MS:60000}

# DB
spring.datasource.url=jdbc:mysql://localhost/crud?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.dbname=crud
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update


# MAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
